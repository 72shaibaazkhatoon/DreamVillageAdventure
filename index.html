
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dream Village Adventure V13</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#83d9ff;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:12px;left:12px;color:white;font-weight:bold;text-shadow:2px 2px 4px #333;z-index:2;pointer-events:none}
#title{font-size:20px}
#score{font-size:17px;margin-top:7px}
#message{font-size:13px;margin-top:5px;color:#fff5a0}
#controls{position:fixed;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:3}
.pad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px 52px;gap:4px}
button{border:2px solid white;border-radius:14px;background:#ffffffcc;font-size:24px;font-weight:bold;color:#70458d;touch-action:none}
.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}
</style>
</head>
<body>

<div id="hud">
 <div id="title">👑 DREAM VILLAGE V13</div>
 <div id="score">🪙 Coins: 0 / 10</div>
 <div id="message">Welcome, Princess! Explore your village ✨</div>
</div>

<canvas id="game"></canvas>

<div id="controls">
 <div class="pad">
  <button class="up" data-key="up">⬆️</button>
  <button class="left" data-key="left">⬅️</button>
  <button class="down" data-key="down">⬇️</button>
  <button class="right" data-key="right">➡️</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight;
let dpr=1;

function resize(){
 dpr=window.devicePixelRatio||1;
 W=innerWidth;
 H=innerHeight;
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

// CONTROLS
const keys={up:false,down:false,left:false,right:false};

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(k==="arrowup"||k==="w"){keys.up=true;e.preventDefault()}
 if(k==="arrowdown"||k==="s"){keys.down=true;e.preventDefault()}
 if(k==="arrowleft"||k==="a"){keys.left=true;e.preventDefault()}
 if(k==="arrowright"||k==="d"){keys.right=true;e.preventDefault()}
});

addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 if(k==="arrowup"||k==="w")keys.up=false;
 if(k==="arrowdown"||k==="s")keys.down=false;
 if(k==="arrowleft"||k==="a")keys.left=false;
 if(k==="arrowright"||k==="d")keys.right=false;
});

addEventListener("blur",()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});

document.querySelectorAll("button[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[k]=true;
  b.setPointerCapture(e.pointerId);
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
  b.addEventListener(ev,()=>keys[k]=false);
 });
});

// PLAYER AND CAMERA
const player={x:0,y:0};
const camera={x:0,y:0};

const WORLD_EDGE=680;
const PLAYER_LIMIT=645;

let coins=0;
let frame=0;
let walkPhase=0;
let rewardShown=false;
let facing=1;

const coinPlaces=[];
for(let i=0;i<24;i++){
 const a=i*2.4;
 const r=100+(i%5)*75;
 coinPlaces.push({
  x:Math.cos(a)*r,
  y:Math.sin(a)*r,
  got:false
 });
}

const houses=[
 [-220,-180,"#ff8b70"],
 [220,-180,"#ffd65c"],
 [-220,180,"#a78bfa"],
 [220,180,"#ff9cc9"],
 [-430,-30,"#74c8f5"],
 [430,30,"#78d89a"],
 [-30,-420,"#ffad62"],
 [30,420,"#e69cf5"]
];

const trees=[];
for(let i=0;i<45;i++){
 const a=i*2.4;
 const r=330+(i%4)*55;
 trees.push({x:Math.cos(a)*r,y:Math.sin(a)*r});
}

const animals=[];
for(let i=0;i<8;i++){
 animals.push({
  x:Math.sin(i*5)*340,
  y:Math.cos(i*4)*330,
  direction:i%2?1:-1,
  type:i%2?"🐶":"🐱",
  speed:.5+(i%3)*.2
 });
}

// DRAWING HELPERS
function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawHouse(x,y,color){
 rounded(x-39,y-27,78,57,8,color);

 ctx.fillStyle="#93482e";
 ctx.beginPath();
 ctx.moveTo(x-48,y-25);
 ctx.lineTo(x,y-65);
 ctx.lineTo(x+48,y-25);
 ctx.closePath();
 ctx.fill();

 rounded(x-10,y+2,20,28,4,"#79432e");
 rounded(x-29,y-15,17,16,3,"#c9f4ff");
 rounded(x+12,y-15,17,16,3,"#c9f4ff");
}

function drawTree(x,y){
 ctx.fillStyle="#81502d";
 ctx.fillRect(x-6,y,12,25);

 ctx.fillStyle="#238c43";
 ctx.beginPath();
 ctx.arc(x,y-7,25,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#42b957";
 ctx.beginPath();
 ctx.arc(x-10,y-16,13,0,Math.PI*2);
 ctx.fill();
}

function drawShop(){
 rounded(-65,-345,130,90,10,"#f7d18a");

 ctx.fillStyle="#a54e38";
 ctx.beginPath();
 ctx.moveTo(-75,-345);
 ctx.lineTo(0,-395);
 ctx.lineTo(75,-345);
 ctx.closePath();
 ctx.fill();

 rounded(-57,-342,114,19,4,"#ff6381");

 for(let i=0;i<5;i++){
  ctx.fillStyle=i%2?"#fff4cf":"#ff6381";
  ctx.fillRect(-57+i*23,-342,23,19);
 }

 rounded(-20,-315,40,60,4,"#75442e");
 rounded(-54,-321,25,24,3,"#b9edff");
 rounded(29,-321,25,24,3,"#b9edff");

 ctx.fillStyle="#fff";
 ctx.font="bold 17px Arial";
 ctx.textAlign="center";
 ctx.fillText("VILLAGE SHOP",0,-370);
}

// WOODEN VILLAGE FENCE
function drawFence(){
 const edge=WORLD_EDGE;

 // Fence rails
 ctx.strokeStyle="#a96835";
 ctx.lineWidth=11;
 ctx.lineCap="round";

 ctx.beginPath();
 ctx.moveTo(-edge,-edge);
 ctx.lineTo(edge,-edge);
 ctx.moveTo(-edge,edge);
 ctx.lineTo(edge,edge);
 ctx.moveTo(-edge,-edge);
 ctx.lineTo(-edge,edge);
 ctx.moveTo(edge,-edge);
 ctx.lineTo(edge,edge);
 ctx.stroke();

 ctx.strokeStyle="#e8b76b";
 ctx.lineWidth=5;

 ctx.beginPath();
 ctx.moveTo(-edge,-edge+13);
 ctx.lineTo(edge,-edge+13);
 ctx.moveTo(-edge,edge-13);
 ctx.lineTo(edge,edge-13);
 ctx.moveTo(-edge+13,-edge);
 ctx.lineTo(-edge+13,edge);
 ctx.moveTo(edge-13,-edge);
 ctx.lineTo(edge-13,edge);
 ctx.stroke();

 // Fence posts
 for(let x=-edge;x<=edge;x+=55){
  fencePost(x,-edge);
  fencePost(x,edge);
 }
 for(let y=-edge+55;y<edge;y+=55){
  fencePost(-edge,y);
  fencePost(edge,y);
 }
}

function fencePost(x,y){
 ctx.fillStyle="#80502f";
 ctx.fillRect(x-6,y-16,12,32);

 ctx.fillStyle="#d99a55";
 ctx.beginPath();
 ctx.arc(x,y-16,7,Math.PI,Math.PI*2);
 ctx.fill();
}

function drawAnimal(a){
 ctx.font="30px Arial";
 ctx.textAlign="center";
 ctx.fillText(a.type,a.x,a.y+Math.sin(frame*.1+a.x)*3);
}

// PRINCESS CHARACTER
// Drawn separately from the village so screen movement works.
function drawPrincess(sx,sy){

 const walking=keys.up||keys.down||keys.left||keys.right;
 const step=walking?Math.sin(walkPhase):0;
 const other=walking?Math.sin(walkPhase+Math.PI):0;
 const lift1=walking?Math.max(0,Math.cos(walkPhase))*7:0;
 const lift2=walking?Math.max(0,-Math.cos(walkPhase))*7:0;
 const bob=walking?Math.abs(Math.sin(walkPhase*2))*2:0;

 ctx.save();
 ctx.translate(sx,sy-bob);

 // Soft shadow
 ctx.fillStyle="#287b32";
 ctx.beginPath();
 ctx.ellipse(0,23,21,6,0,0,Math.PI*2);
 ctx.fill();

 // Long hair behind body
 const hair=ctx.createLinearGradient(-17,-45,20,15);
 hair.addColorStop(0,"#24152c");
 hair.addColorStop(.45,"#56304b");
 hair.addColorStop(1,"#170e20");

 ctx.fillStyle=hair;
 ctx.beginPath();
 ctx.moveTo(-15,-42);
 ctx.quadraticCurveTo(-30,-20,-23,12);
 ctx.quadraticCurveTo(-20,23,-11,16);
 ctx.lineTo(-8,-12);
 ctx.lineTo(10,-12);
 ctx.lineTo(13,16);
 ctx.quadraticCurveTo(25,22,24,7);
 ctx.quadraticCurveTo(29,-23,15,-42);
 ctx.closePath();
 ctx.fill();

 // Hair shine
 ctx.strokeStyle="#a978a3";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(-19,-28);
 ctx.quadraticCurveTo(-23,-4,-16,8);
 ctx.moveTo(18,-25);
 ctx.quadraticCurveTo(24,-2,17,8);
 ctx.stroke();

 // Legs
 function leg(side,movement,lift){
  const hx=side*6;
  const kx=hx+movement*5;
  const ky=18-lift*.4;
  const fx=hx+movement*10;
  const fy=29-lift;

  ctx.strokeStyle="#f4b28e";
  ctx.lineWidth=7;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.beginPath();
  ctx.moveTo(hx,7);
  ctx.lineTo(kx,ky);
  ctx.lineTo(fx,fy);
  ctx.stroke();

  // Pink princess shoes
  ctx.save();
  ctx.translate(fx,fy+2);
  ctx.rotate(movement*.12);

  const shoe=ctx.createLinearGradient(0,-5,0,5);
  shoe.addColorStop(0,"#ffb1dc");
  shoe.addColorStop(1,"#d83f9b");

  ctx.fillStyle=shoe;
  ctx.beginPath();
  ctx.ellipse(0,0,9,5,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffe5f5";
  ctx.beginPath();
  ctx.arc(1,-2,2,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 }

 leg(-1,step,lift1);
 leg(1,other,lift2);

 // Arms with opposite swing
 function arm(side,movement){
  const x=side*12;
  ctx.strokeStyle="#f5bd9b";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(x,-8);
  ctx.quadraticCurveTo(x+movement*.5,-1,x+movement,7);
  ctx.stroke();

  ctx.fillStyle="#ffd0ad";
  ctx.beginPath();
  ctx.arc(x+movement,7,4,0,Math.PI*2);
  ctx.fill();
 }
 arm(-1,walking?-step*8:0);
 arm(1,walking?step*8:0);

 // Princess dress
 const dress=ctx.createLinearGradient(-15,-15,15,25);
 dress.addColorStop(0,"#ffb5e3");
 dress.addColorStop(.5,"#e879c4");
 dress.addColorStop(1,"#9b63d9");

 ctx.fillStyle=dress;
 ctx.beginPath();
 ctx.moveTo(-10,-16);
 ctx.lineTo(10,-16);
 ctx.lineTo(19,13);
 ctx.quadraticCurveTo(0,22,-19,13);
 ctx.closePath();
 ctx.fill();

 // Dress border
 ctx.strokeStyle="#ffe1ff";
 ctx.lineWidth=2;
 ctx.stroke();

 // Skirt decoration
 ctx.fillStyle="#fff0ff";
 for(let i=-1;i<=1;i++){
  ctx.beginPath();
  ctx.arc(i*9,8,2,0,Math.PI*2);
  ctx.fill();
 }

 // Golden belt
 ctx.fillStyle="#ffd45c";
 ctx.fillRect(-10,-11,20,4);

 // Neck
 ctx.fillStyle="#ffd0ad";
 ctx.fillRect(-4,-22,8,8);

 // Face
 const skin=ctx.createLinearGradient(-12,-40,13,-15);
 skin.addColorStop(0,"#ffe0c5");
 skin.addColorStop(1,"#f3ae8e");

 ctx.fillStyle=skin;
 ctx.beginPath();
 ctx.ellipse(0,-31,15,18,0,0,Math.PI*2);
 ctx.fill();

 // Ears
 ctx.fillStyle="#f4b28e";
 ctx.beginPath();
 ctx.arc(-15,-30,4,0,Math.PI*2);
 ctx.arc(15,-30,4,0,Math.PI*2);
 ctx.fill();

 // Front hair
 ctx.fillStyle=hair;
 ctx.beginPath();
 ctx.arc(0,-39,16,Math.PI,Math.PI*2);
 ctx.quadraticCurveTo(19,-36,12,-27);
 ctx.quadraticCurveTo(6,-39,0,-32);
 ctx.quadraticCurveTo(-8,-25,-14,-29);
 ctx.quadraticCurveTo(-19,-38,-15,-43);
 ctx.closePath();
 ctx.fill();

 // Hair locks
 ctx.strokeStyle="#75496c";
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(-10,-41);
 ctx.quadraticCurveTo(-5,-33,-10,-28);
 ctx.moveTo(5,-43);
 ctx.quadraticCurveTo(11,-35,8,-29);
 ctx.stroke();

 // Big brown eyes
 for(const x of [-6,6]){
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.ellipse(x,-31,4.5,5.5,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#754329";
  ctx.beginPath();
  ctx.ellipse(x,-30,3,4,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#201426";
  ctx.beginPath();
  ctx.arc(x,-30,1.7,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x-1,-32,1.3,0,Math.PI*2);
  ctx.fill();
 }

 // Eyebrows
 ctx.strokeStyle="#553047";
 ctx.lineWidth=1.8;
 ctx.beginPath();
 ctx.moveTo(-10,-38);
 ctx.quadraticCurveTo(-6,-41,-2,-38);
 ctx.moveTo(2,-38);
 ctx.quadraticCurveTo(6,-41,10,-38);
 ctx.stroke();

 // Blush
 ctx.fillStyle="#f68ca7";
 ctx.beginPath();
 ctx.ellipse(-11,-23,3.5,2,0,0,Math.PI*2);
 ctx.ellipse(11,-23,3.5,2,0,0,Math.PI*2);
 ctx.fill();

 // Smile
 ctx.strokeStyle="#a34b5c";
 ctx.lineWidth=1.7;
 ctx.beginPath();
 ctx.arc(0,-23,4,.15,Math.PI-.15);
 ctx.stroke();

 // Golden princess crown
 const gold=ctx.createLinearGradient(0,-60,0,-42);
 gold.addColorStop(0,"#fff1a3");
 gold.addColorStop(.5,"#ffcb36");
 gold.addColorStop(1,"#c88719");

 ctx.fillStyle=gold;
 ctx.beginPath();
 ctx.moveTo(-12,-44);
 ctx.lineTo(-13,-55);
 ctx.lineTo(-6,-50);
 ctx.lineTo(0,-61);
 ctx.lineTo(6,-50);
 ctx.lineTo(13,-55);
 ctx.lineTo(12,-44);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle="#fff2b3";
 ctx.lineWidth=1.5;
 ctx.stroke();

 // Crown jewels
 ctx.fillStyle="#ff5e9b";
 ctx.beginPath();
 ctx.arc(0,-51,3,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#8feaff";
 ctx.beginPath();
 ctx.arc(-8,-48,2,0,Math.PI*2);
 ctx.arc(8,-48,2,0,Math.PI*2);
 ctx.fill();

 // Small earrings
 ctx.fillStyle="#ffe16b";
 ctx.beginPath();
 ctx.arc(-15,-23,2,0,Math.PI*2);
 ctx.arc(15,-23,2,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

// CAMERA
function updateCamera(){
 const minX=W*.20;
 const maxX=W*.80;
 const minY=H*.20;
 const maxY=H*.72;

 const sx=W/2+player.x-camera.x;
 const sy=H/2+player.y-camera.y;

 const targetX=camera.x+sx-Math.max(minX,Math.min(maxX,sx));
 const targetY=camera.y+sy-Math.max(minY,Math.min(maxY,sy));

 camera.x+=(targetX-camera.x)*.20;
 camera.y+=(targetY-camera.y)*.20;
}

// WORLD DRAWING
function drawWorld(){
 frame++;

 ctx.fillStyle="#63c94d";
 ctx.fillRect(0,0,W,H);

 ctx.save();
 ctx.translate(W/2-camera.x,H/2-camera.y);

 // Roads
 ctx.fillStyle="#d6b887";
 ctx.fillRect(-1000,-48,2000,96);
 ctx.fillRect(-48,-1000,96,2000);

 ctx.fillStyle="#f1d9aa";
 ctx.fillRect(-1000,-4,2000,8);
 ctx.fillRect(-4,-1000,8,2000);

 houses.forEach(h=>drawHouse(h[0],h[1],h[2]));
 trees.forEach(t=>drawTree(t.x,t.y));
 drawShop();

 // Flowers
 for(let i=0;i<85;i++){
  const x=Math.sin(i*19)*530;
  const y=Math.cos(i*13)*530;

  ctx.fillStyle=["#ffec62","#ff80b5","#ffffff","#b98cff"][i%4];
  ctx.beginPath();
  ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fill();
 }

 // Pond
 ctx.fillStyle="#258fdf";
 ctx.beginPath();
 ctx.ellipse(310,280,65,42,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#8ce7ff";
 ctx.beginPath();
 ctx.ellipse(300,270,24,8,0,0,Math.PI*2);
 ctx.fill();

 // Benches
 for(const [x,y] of [
  [-130,100],[130,-100],[-150,-110],[150,110]
 ]){
  rounded(x-22,y-7,44,14,3,"#87502f");
  ctx.fillStyle="#444";
  ctx.fillRect(x-17,y+7,5,12);
  ctx.fillRect(x+12,y+7,5,12);
 }

 // Animals
 animals.forEach(a=>{
  drawAnimal(a);
  a.x+=a.direction*a.speed;
  if(a.x>470||a.x< -470)a.direction*=-1;
 });

 // Coins
 coinPlaces.forEach(c=>{
  if(c.got)return;

  const bob=Math.sin(frame*.08+c.x)*4;
  ctx.fillStyle="#ffbd00";
  ctx.beginPath();
  ctx.arc(c.x,c.y+bob,12,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff18a";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.fillStyle="#9a6500";
  ctx.font="bold 14px Arial";
  ctx.textAlign="center";
  ctx.fillText("$",c.x,c.y+bob+5);
 });

 // Draw fence last so its rails remain visible
 drawFence();

 ctx.restore();
}

// COINS
function collectCoins(){
 coinPlaces.forEach(c=>{
  if(!c.got&&Math.hypot(c.x-player.x,c.y-player.y)<27){
   c.got=true;
   coins++;

   document.getElementById("score").textContent=
    "🪙 Coins: "+coins+" / 10";

   document.getElementById("message").textContent=
    coins>=10
    ?"🎉 Princess treasure champion!"
    :"✨ A beautiful treasure collected!";

   if(coins>=10&&!rewardShown){
    rewardShown=true;
    setTimeout(()=>{
     alert("👑 CONGRATULATIONS, PRINCESS! 👑\nYou collected 10 coins!\nYou are the Dream Village Champion!");
    },100);
   }
  }
 });
}

// GAME MOVEMENT
function update(){

 let dx=0,dy=0;

 if(keys.up)dy-=1;
 if(keys.down)dy+=1;
 if(keys.left)dx-=1;
 if(keys.right)dx+=1;

 if(dx!==0||dy!==0){
  const length=Math.hypot(dx,dy);
  dx/=length;
  dy/=length;

  const nextX=player.x+dx*3;
  const nextY=player.y+dy*3;

  // Boundary collision
  player.x=Math.max(-PLAYER_LIMIT,Math.min(PLAYER_LIMIT,nextX));
  player.y=Math.max(-PLAYER_LIMIT,Math.min(PLAYER_LIMIT,nextY));

  if(dx!==0)facing=dx>0?1:-1;
  walkPhase+=.24;
 }

 updateCamera();
 collectCoins();
 drawWorld();

 // Princess stays in the screen layer, not the village layer.
 const screenX=W/2+player.x-camera.x;
 const screenY=H/2+player.y-camera.y;

 drawPrincess(screenX,screenY);

 requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
