
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dream Village Adventure V16</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9bd9ff;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5;pointer-events:none;gap:8px}
.panel{background:#ffffffdf;color:#49351f;border-radius:14px;padding:10px;font-weight:bold;font-size:13px;box-shadow:0 3px 12px #0002}
#message{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:white;color:#65411e;padding:10px 16px;border-radius:20px;font-weight:bold;z-index:6;white-space:nowrap}
#controls{position:fixed;bottom:22px;left:18px;display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px;gap:5px;z-index:8}
.ctrl{border:2px solid white;background:#ffffffc9;border-radius:15px;font-size:25px;color:#553a2a;font-weight:bold;touch-action:none}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#shop{position:fixed;bottom:28px;right:18px;padding:14px 18px;border:0;border-radius:18px;background:#ffcf59;color:#563714;font-weight:bold;font-size:16px;z-index:8}
#hint{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);color:white;text-shadow:0 2px 4px #333;font-size:11px;white-space:nowrap}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">🌸 DREAM VILLAGE V16</div>
 <div class="panel">🪙 <span id="coins">0</span></div>
</div>

<div id="message">Welcome to your 3D village!</div>

<div id="controls">
 <button class="ctrl" id="up">▲</button>
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="down">▼</button>
 <button class="ctrl" id="right">▶</button>
</div>

<button id="shop">🛍️ SHOP</button>
<div id="hint">Use arrows or keyboard WASD to explore</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd9ff);
scene.fog=new THREE.Fog(0x9bd9ff,45,100);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
camera.position.set(0,9,13);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x71854a,2));

const sun=new THREE.DirectionalLight(0xfff1d5,3);
sun.position.set(-12,20,10);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-35;
sun.shadow.camera.right=35;
sun.shadow.camera.top=35;
sun.shadow.camera.bottom=-35;
scene.add(sun);

function material(color,roughness=.85){
 return new THREE.MeshStandardMaterial({color,roughness});
}

const grass=material(0x6eae52);
const earth=material(0xb98b59);
const wood=material(0x80502d);
const white=material(0xffffff);

function make(geometry,mat,parent,x=0,y=0,z=0){
 const m=new THREE.Mesh(geometry,mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 parent.add(m);
 return m;
}

function block(parent,x,y,z,sx,sy,sz,color){
 return make(new THREE.BoxGeometry(sx,sy,sz),material(color),parent,x,y,z);
}

function ball(parent,x,y,z,sx,sy,sz,mat){
 const m=make(new THREE.SphereGeometry(1,20,16),mat,parent,x,y,z);
 m.scale.set(sx,sy,sz);
 return m;
}

// Ground
const ground=make(new THREE.PlaneGeometry(100,100),grass,scene);
ground.rotation.x=-Math.PI/2;

// Village roads
function path(x,z,w,d){
 make(new THREE.BoxGeometry(w,.04,d),earth,scene,x,.02,z);
}
path(0,0,5,55);
path(0,0,55,4);
path(-13,0,4,25);
path(13,0,4,25);

// Village boundary
for(let i=-25;i<=25;i+=2.5){
 for(const z of [-24,24]){
  block(scene,i,.65,z,.13,1.3,.13,0x9b693d);
  block(scene,i,.9,z,2.5,.13,.12,0xe5c18b);
 }
 for(const x of [-25,25]){
  block(scene,x,.65,i,.13,1.3,.13,0x9b693d);
  block(scene,x,.9,i,.12,.13,2.5,0xe5c18b);
 }
}

// Houses
function house(x,z,wallColor,roofColor){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);

 block(g,0,1.3,0,4,2.6,3.5,wallColor);

 const roof=make(
  new THREE.ConeGeometry(3.15,2.1,4),
  material(roofColor),g,0,3.25,0
 );
 roof.rotation.y=Math.PI/4;

 block(g,0,.85,1.79,.95,1.7,.12,0x70401f);
 block(g,-1.15,1.7,1.81,.8,.8,.12,0x9ed8ed);
 block(g,1.15,1.7,1.81,.8,.8,.12,0x9ed8ed);
 block(g,0,.1,2.15,1.5,.18,.9,0x997047);
}

house(-9,-9,0xffd9a0,0xb94f45);
house(9,-9,0xf5c4cf,0x7748a6);
house(-10,10,0xe9d1a4,0x507cba);
house(10,10,0xf2dda9,0xa84f3c);

// Trees
function tree(x,z,s=1){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);

 make(new THREE.CylinderGeometry(.22*s,.35*s,2*s,9),wood,g,0,s,0);

 ball(g,0,2.4*s,0,1.35*s,1.35*s,1.35*s,material(0x398e46));
 ball(g,.65*s,2.2*s,.15*s,.9*s,.9*s,.9*s,material(0x58aa50));
}

for(let i=0;i<32;i++){
 const x=(Math.random()-.5)*43;
 const z=(Math.random()-.5)*43;
 if(Math.abs(x)<7||Math.abs(z)<7)continue;
 tree(x,z,.7+Math.random()*.6);
}

// Flowers
for(let i=0;i<55;i++){
 const x=(Math.random()-.5)*42;
 const z=(Math.random()-.5)*42;
 if(Math.abs(x)<4||Math.abs(z)<4)continue;

 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,.08,z);

 make(new THREE.CylinderGeometry(.025,.035,.3,5),material(0x277a37),g,0,.15,0);
 ball(g,0,.32,0,.13,.13,.13,material([0xffa3cf,0xffe36d,0xffffff][i%3]));
}

// Princess character
const princess=new THREE.Group();
scene.add(princess);

const skin=material(0xf2bd91);
const hair=material(0x5b2e24);
const dress=material(0xe65c9a);
const dressLight=material(0xff9bc7);
const shoes=material(0x7440a0);
const eye=material(0x302027);
const gold=material(0xffd65b);

ball(princess,0,1.12,0,.39,.55,.25,dress);

const skirt=make(
 new THREE.ConeGeometry(.85,1.05,24),
 dressLight,princess,0,.55,0
);
skirt.rotation.x=Math.PI;

ball(princess,0,1.72,0,.24,.25,.22,skin);
ball(princess,0,2.12,0,.43,.48,.4,skin);

ball(princess,0,2.42,-.12,.46,.35,.43,hair);
ball(princess,-.36,2.12,0,.15,.42,.19,hair);
ball(princess,.36,2.12,0,.15,.42,.19,hair);

ball(princess,-.15,2.17,.365,.045,.065,.035,eye);
ball(princess,.15,2.17,.365,.045,.065,.035,eye);
ball(princess,-.15,2.19,.395,.014,.02,.012,white);
ball(princess,.15,2.19,.395,.014,.02,.012,white);
ball(princess,0,2.02,.4,.07,.035,.025,material(0xd97975));

// Crown
make(new THREE.CylinderGeometry(.25,.32,.16,5),gold,princess,0,2.57,0);
for(let i=-1;i<=1;i++){
 ball(princess,i*.16,2.69,.02,.075,.075,.075,material(0xff6a9e));
}
ball(princess,0,2.65,-.24,.24,.23,.25,hair);

// Moving arms and legs
function limb(parent,length,radius,mat){
 const pivot=new THREE.Group();
 parent.add(pivot);

 make(
  new THREE.CylinderGeometry(radius*.8,radius,length,12),
  mat,pivot,0,-length/2,0
 );

 ball(pivot,0,-length,0,radius,radius,radius,mat);
 return pivot;
}

const leftArm=limb(princess,.62,.12,skin);
leftArm.position.set(-.43,1.52,0);

const rightArm=limb(princess,.62,.12,skin);
rightArm.position.set(.43,1.52,0);

const leftLeg=limb(princess,.55,.13,skin);
leftLeg.position.set(-.2,.35,0);

const rightLeg=limb(princess,.55,.13,skin);
rightLeg.position.set(.2,.35,0);

ball(princess,-.2,-.18,.07,.19,.11,.28,shoes);
ball(princess,.2,-.18,.07,.19,.11,.28,shoes);

// Backpack
block(princess,0,1.25,-.31,.48,.55,.18,0x61b5e8);

// Animals
function animal(x,z,color){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,0,z);

 const fur=material(color);
 ball(g,0,.75,0,.65,.4,.35,fur);
 ball(g,0,1.05,.3,.28,.3,.27,fur);

 ball(g,-.12,1.09,.55,.035,.04,.03,eye);
 ball(g,.12,1.09,.55,.035,.04,.03,eye);

 for(const xx of [-.4,.4]){
  for(const zz of [-.2,.2]){
   const leg=make(
    new THREE.CylinderGeometry(.07,.08,.48,8),
    fur,g,xx,.25,zz
   );
   leg.userData.leg=true;
  }
 }
 return g;
}

const cow=animal(-5,3,0xf1eee4);
const sheep=animal(5,5,0xe8d8b9);
const goat=animal(7,-3,0x9b7553);

// Coins
const coins=[];
const goldMat=material(0xffcf50,.4);

for(let i=0;i<18;i++){
 let x=(Math.random()-.5)*27;
 let z=(Math.random()-.5)*27;

 if(Math.abs(x)<4&&Math.abs(z)<4)x+=7;

 const c=make(
  new THREE.TorusGeometry(.27,.09,10,20),
  goldMat,scene,x,.75,z
 );
 c.userData.baseY=.75;
 coins.push(c);
}

// Clouds
function cloud(x,y,z){
 const g=new THREE.Group();
 scene.add(g);
 g.position.set(x,y,z);

 for(let i=0;i<5;i++){
  ball(g,(i-2)*.55,0,0,.65,.4,.4,white);
 }
}
cloud(-12,13,-18);
cloud(8,15,-22);
cloud(17,12,12);

// Controls
const keys={};
const controls={
 up:'ArrowUp',
 down:'ArrowDown',
 left:'ArrowLeft',
 right:'ArrowRight'
};

function setKey(k,v){
 keys[k]=v;
}

for(const [id,key] of Object.entries(controls)){
 const el=document.getElementById(id);

 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  setKey(key,true);
 });

 function release(){
  setKey(key,false);
 }

 el.addEventListener('pointerup',release);
 el.addEventListener('pointercancel',release);
 el.addEventListener('lostpointercapture',release);
}

addEventListener('keydown',e=>{
 keys[e.key]=true;
});

addEventListener('keyup',e=>{
 keys[e.key]=false;
});

addEventListener('blur',()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});

// Messages and rewards
let coinsCount=0;
const message=document.getElementById('message');
let messageTimer;

function say(t){
 message.textContent=t;
 message.style.display='block';

 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>{
  message.style.display='none';
 },2500);
}

document.getElementById('shop').onclick=()=>{
 if(coinsCount>=5){
  coinsCount-=5;
  document.getElementById('coins').textContent=coinsCount;
  say('🎁 You bought a beautiful village gift!');
 }else{
  say('Collect 5 coins to buy a gift!');
 }
};

// Game loop
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;

 let dx=0;
 let dz=0;

 if(keys.ArrowUp||keys.w||keys.W)dz-=1;
 if(keys.ArrowDown||keys.s||keys.S)dz+=1;
 if(keys.ArrowLeft||keys.a||keys.A)dx-=1;
 if(keys.ArrowRight||keys.d||keys.D)dx+=1;

 const moving=Math.abs(dx)+Math.abs(dz)>0;

 if(moving){
  const len=Math.hypot(dx,dz);
  dx/=len;
  dz/=len;

  princess.position.x+=dx*5*dt;
  princess.position.z+=dz*5*dt;

  princess.rotation.y=Math.atan2(dx,dz);

  const swing=Math.sin(t*11)*.55;

  leftLeg.rotation.x=swing;
  rightLeg.rotation.x=-swing;
  leftArm.rotation.x=-swing*.7;
  rightArm.rotation.x=swing*.7;
 }else{
  leftLeg.rotation.x*=.8;
  rightLeg.rotation.x*=.8;
  leftArm.rotation.x*=.8;
  rightArm.rotation.x*=.8;
 }

 // Keep character inside village
 princess.position.x=THREE.MathUtils.clamp(princess.position.x,-23,23);
 princess.position.z=THREE.MathUtils.clamp(princess.position.z,-22,22);

 princess.position.y=moving?Math.abs(Math.sin(t*11))*.06:0;

 // Camera follows character
 const desired=new THREE.Vector3(
  princess.position.x,
  8.5,
  princess.position.z+11
 );

 camera.position.lerp(desired,.07);
 camera.lookAt(
  princess.position.x,
  1.1,
  princess.position.z
 );

 // Animals move and walk
 [cow,sheep,goat].forEach((a,i)=>{
  a.position.x+=Math.sin(t*.45+i)*.25*dt;
  a.position.z+=Math.cos(t*.4+i)*.25*dt;
  a.rotation.y=Math.sin(t*.45+i)*.5;

  a.children.forEach((child,j)=>{
   if(child.userData.leg){
    child.rotation.x=Math.sin(t*4+j+i)*.15;
   }
  });
 });

 // Coins spin and collect
 coins.forEach(c=>{
  c.rotation.y=t*2;
  c.position.y=c.userData.baseY+
   Math.sin(t*3+c.position.x)*.12;

  if(c.visible&&c.position.distanceTo(princess.position)<1.1){
   c.visible=false;
   coinsCount++;

   document.getElementById('coins').textContent=coinsCount;
   say('✨ Coin collected! +1');
  }
 });

 renderer.render(scene,camera);
}

animate();

// Screen resizing
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
