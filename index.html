
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dream Village Adventure V13</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#83d9ff;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:10px;color:#fff;background:#7845a8;padding:10px 15px;border-radius:15px;font-weight:bold;box-shadow:0 3px 8px #555}
#message{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#fff2b8;padding:8px 14px;border-radius:12px;font-weight:bold;color:#704323}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.pad{display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px;gap:5px;pointer-events:auto}
.control{border:2px solid white;border-radius:15px;background:#9b62d9;color:white;font-size:25px;font-weight:bold;box-shadow:0 3px 6px #555;touch-action:none}
.control:active{background:#6332a3}
#jump{width:70px;height:70px;border-radius:50%;align-self:end;background:#ff8bba}
#shop{position:fixed;right:12px;top:12px;border:0;border-radius:12px;background:#ffbd45;padding:10px;font-weight:bold}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">💰 Coins: <span id="coins">0</span> | 👑 Princess</div>
<div id="message">Welcome to Dream Village! 🌸</div>
<button id="shop">🏡 Shop</button>
<div id="controls">
  <div class="pad">
    <button class="control" style="grid-column:2" data-key="up">⬆</button>
    <button class="control" style="grid-column:1;grid-row:2" data-key="left">⬅</button>
    <button class="control" style="grid-column:2;grid-row:2" data-key="down">⬇</button>
    <button class="control" style="grid-column:3;grid-row:2" data-key="right">➡</button>
  </div>
  <button class="control" id="jump">⬆</button>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
resize();addEventListener("resize",resize);

const world={w:2200,h:1500};
const player={x:500,y:500,speed:3.2,dir:1,walk:0,jump:0};
let camera={x:0,y:0};
let coins=0;
const keys={};
let messageTimer=0;

function say(t){document.getElementById("message").textContent=t;messageTimer=180}
function rand(min,max){return Math.random()*(max-min)+min}

const coinList=[];
for(let i=0;i<35;i++)coinList.push({x:rand(120,world.w-120),y:rand(120,world.h-120),got:false});

const animals=[
 {x:330,y:300,type:"🐶"},{x:850,y:340,type:"🐰"},
 {x:1200,y:700,type:"🐑"},{x:1650,y:400,type:"🐥"},
 {x:600,y:1000,type:"🐱"},{x:1850,y:1100,type:"🐶"}
];

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}

function drawGround(){
 ctx.fillStyle="#79cf70";ctx.fillRect(0,0,world.w,world.h);
 for(let x=0;x<world.w;x+=90)for(let y=0;y<world.h;y+=90){
  ctx.fillStyle=(x/90+y/90)%2?"#80d775":"#76cb6c";
  ctx.fillRect(x,y,90,90);
 }
 // Paths
 ctx.fillStyle="#e9cf91";
 ctx.fillRect(0,690,world.w,95);
 ctx.fillRect(1050,0,100,world.h);
 // Flowers
 for(let i=0;i<160;i++){
  let x=(i*173)%world.w,y=(i*293)%world.h;
  ctx.fillStyle=["#ff77b7","#fff4a3","#ffffff"][i%3];
  ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
 }
}

function drawHouse(x,y,color){
 ctx.fillStyle="#a65d38";ctx.fillRect(x,y+45,145,110);
 ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x-12,y+50);ctx.lineTo(x+72,y-15);ctx.lineTo(x+157,y+50);ctx.closePath();ctx.fill();
 ctx.fillStyle="#8be4ff";ctx.fillRect(x+18,y+75,35,35);ctx.fillRect(x+92,y+75,35,35);
 ctx.fillStyle="#75412c";ctx.fillRect(x+62,y+100,30,55);
 ctx.fillStyle="#ffdc80";ctx.beginPath();ctx.arc(x+85,y+125,3,0,7);ctx.fill();
}

function drawFence(){
 ctx.lineWidth=8;ctx.strokeStyle="#9b6335";
 ctx.strokeRect(40,40,world.w-80,world.h-80);
 ctx.lineWidth=3;ctx.strokeStyle="#e2b77b";
 for(let x=40;x<=world.w-40;x+=28){
  ctx.beginPath();ctx.moveTo(x,40);ctx.lineTo(x,68);ctx.moveTo(x,world.h-40);ctx.lineTo(x,world.h-68);ctx.stroke();
 }
 for(let y=40;y<=world.h-40;y+=28){
  ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(68,y);ctx.moveTo(world.w-40,y);ctx.lineTo(world.w-68,y);ctx.stroke();
 }
}

function drawTree(x,y){
 ctx.fillStyle="#79502e";ctx.fillRect(x-8,y,16,40);
 ctx.fillStyle="#269b4c";ctx.beginPath();ctx.arc(x,y-5,29,0,7);ctx.fill();
 ctx.fillStyle="#55c96c";ctx.beginPath();ctx.arc(x-12,y-16,15,0,7);ctx.fill();
}

function drawPrincess(){
 let x=player.x,y=player.y;
 let swing=Math.sin(player.walk)*5;
 ctx.save();ctx.translate(x,y);
 // Shadow
 ctx.fillStyle="#397b3b55";ctx.beginPath();ctx.ellipse(0,29,23,8,0,0,7);ctx.fill();
 // Shoes and legs
 ctx.strokeStyle="#f5c29b";ctx.lineWidth=7;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-7,12);ctx.lineTo(-8+swing,27+player.jump);
 ctx.moveTo(7,12);ctx.lineTo(8-swing,27+player.jump);ctx.stroke();
 ctx.fillStyle="#ff70b0";
 ctx.beginPath();ctx.ellipse(-9+swing,28+player.jump,8,5,0,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(9-swing,28+player.jump,8,5,0,0,7);ctx.fill();
 // Dress
 ctx.fillStyle="#ed82cf";ctx.beginPath();
 ctx.moveTo(-9,-15);ctx.lineTo(-24,16);ctx.quadraticCurveTo(0,26,24,16);
 ctx.lineTo(9,-15);ctx.closePath();ctx.fill();
 ctx.fillStyle="#ffb5e7";ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(-5,17);ctx.lineTo(5,17);ctx.closePath();ctx.fill();
 // Arms
 ctx.strokeStyle="#f5c29b";ctx.lineWidth=6;
 ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(-20+swing,-1);
 ctx.moveTo(10,-10);ctx.lineTo(20-swing,-1);ctx.stroke();
 // Hair behind head
 ctx.fillStyle="#17101e";
 ctx.beginPath();ctx.ellipse(0,-26,19,23,0,0,7);ctx.fill();
 ctx.fillRect(-17,-28,34,42);
 // Face
 ctx.fillStyle="#f5c29b";ctx.beginPath();ctx.ellipse(0,-29,14,17,0,0,7);ctx.fill();
 // Hair fringe
 ctx.fillStyle="#17101e";ctx.beginPath();
 ctx.arc(0,-37,15,Math.PI,Math.PI*2);ctx.lineTo(14,-30);
 ctx.quadraticCurveTo(5,-39,-2,-32);ctx.quadraticCurveTo(-8,-25,-14,-31);ctx.closePath();ctx.fill();
 // Eyes
 ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(-5,-29,3.5,4.5,0,0,7);ctx.ellipse(5,-29,3.5,4.5,0,0,7);ctx.fill();
 ctx.fillStyle="#5b3425";ctx.beginPath();ctx.arc(-5,-29,2,0,7);ctx.arc(5,-29,2,0,7);ctx.fill();
 // Smile
 ctx.strokeStyle="#a84d5e";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,-23,4,0.2,2.9);ctx.stroke();
 // Crown
 ctx.fillStyle="#ffd83d";ctx.beginPath();
 ctx.moveTo(-12,-45);ctx.lineTo(-10,-57);ctx.lineTo(-3,-50);
 ctx.lineTo(0,-61);ctx.lineTo(4,-50);ctx.lineTo(11,-57);
 ctx.lineTo(12,-45);ctx.closePath();ctx.fill();
 ctx.fillStyle="#ff5c9c";ctx.beginPath();ctx.arc(0,-54,2,0,7);ctx.fill();
 ctx.restore();
}

function drawCoin(c){
 if(c.got)return;
 ctx.fillStyle="#ffd329";ctx.beginPath();ctx.arc(c.x,c.y,10,0,7);ctx.fill();
 ctx.strokeStyle="#fff4a0";ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle="#b47a00";ctx.font="bold 12px Arial";ctx.fillText("$",c.x-4,c.y+4);
}

function drawAnimal(a){
 ctx.font="30px Arial";ctx.textAlign="center";ctx.fillText(a.type,a.x,a.y);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(-camera.x,-camera.y);
 drawGround();
 drawHouse(180,180,"#e76e78");
 drawHouse(1450,180,"#8c78d6");
 drawHouse(300,1050,"#e8a443");
 drawHouse(1510,1000,"#e76eaa");
 for(let i=0;i<25;i++)drawTree(120+(i*311)%1950,100+(i*197)%1280);
 for(const c of coinList)drawCoin(c);
 for(const a of animals)drawAnimal(a);
 drawPrincess();
 drawFence();
 ctx.restore();
}

function update(){
 let dx=0,dy=0;
 if(keys.left||keys.a)dx--;
 if(keys.right||keys.d)dx++;
 if(keys.up||keys.w)dy--;
 if(keys.down||keys.s)dy++;
 if(dx||dy){
  let length=Math.hypot(dx,dy);
  dx=dx/length*player.speed;dy=dy/length*player.speed;
  player.walk+=0.22;
  if(dx)player.dir=Math.sign(dx);
 }
 let nx=player.x+dx,ny=player.y+dy;
 // Fence collision
 if(nx>65&&nx<world.w-65)player.x=nx;
 if(ny>65&&ny<world.h-65)player.y=ny;
 if(player.jump>0)player.jump=Math.max(0,player.jump-1);
 // Camera follows near screen edges
 let margin=100;
 if(player.x-camera.x>W-margin)camera.x=player.x-W+margin;
 if(player.x-camera.x<margin)camera.x=player.x-margin;
 if(player.y-camera.y>H-margin)camera.y=player.y-H+margin;
 if(player.y-camera.y<margin)camera.y=player.y-margin;
 camera.x=Math.max(0,Math.min(world.w-W,camera.x));
 camera.y=Math.max(0,Math.min(world.h-H,camera.y));
 for(const c of coinList){
  if(!c.got&&Math.hypot(player.x-c.x,player.y-c.y)<28){
   c.got=true;coins++;document.getElementById("coins").textContent=coins;
   say("You found a golden coin! ✨");
  }
 }
}

function loop(){
 update();draw();
 if(messageTimer>0)messageTimer--;
 requestAnimationFrame(loop);
}

document.querySelectorAll("[data-key]").forEach(btn=>{
 const k=btn.dataset.key;
 btn.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,()=>keys[k]=false));
});
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();player.jump=18;say("Princess is jumping! 🌟");
});
document.getElementById("shop").onclick=()=>say("Welcome to the village shop! 🏡 More items coming soon!");
canvas.addEventListener("pointerdown",e=>{
 if(e.target===canvas)say("Explore the village and collect golden coins! 💛");
});
say("Welcome to Dream Village V13! 👑");
loop();
</script>
</body>
</html>
