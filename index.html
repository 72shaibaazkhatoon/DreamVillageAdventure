
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Village Adventure</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 text-align:center;
 background:linear-gradient(#83d8ff,#d9f7c5);
 color:#23452b;
}
h1{margin:15px 5px;font-size:27px}
#stats{
 display:flex;
 justify-content:space-around;
 flex-wrap:wrap;
 gap:8px;
 margin:12px;
 font-weight:bold;
}
canvas{
 width:94%;
 max-width:600px;
 background:#9be477;
 border:4px solid #fff;
 border-radius:15px;
 touch-action:none;
}
.controls{
 margin:12px auto;
 display:grid;
 grid-template-columns:60px 60px 60px;
 justify-content:center;
 gap:7px;
}
button{
 border:0;
 border-radius:12px;
 padding:15px;
 background:#287d42;
 color:white;
 font-size:20px;
 font-weight:bold;
}
button:active{background:#145329}
#message{font-weight:bold;min-height:25px}
</style>
</head>
<body>

<h1>🏡 Dream Village Adventure</h1>

<div id="stats">
 <span>🪙 Coins: <span id="coins">0</span></span>
 <span>🌸 Flowers: <span id="flowers">0</span></span>
 <span>⭐ Level: <span id="level">1</span></span>
</div>

<canvas id="game" width="600" height="400"></canvas>

<div class="controls">
 <span></span><button onclick="move(0,-1)">⬆️</button><span></span>
 <button onclick="move(-1,0)">⬅️</button>
 <button onclick="move(0,1)">⬇️</button>
 <button onclick="move(1,0)">➡️</button>
</div>

<p id="message">Explore the village and collect treasures!</p>
<button onclick="restart()">🔄 Restart Game</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={x:300,y:200};
let coins=0,flowers=0,level=1;

let treasures=[
 {x:100,y:100,type:"coin"},
 {x:500,y:100,type:"flower"},
 {x:200,y:300,type:"coin"},
 {x:450,y:300,type:"flower"},
 {x:300,y:80,type:"coin"},
 {x:100,y:300,type:"flower"}
];

function draw(){
 ctx.clearRect(0,0,600,400);

 // Grass
 ctx.fillStyle="#8bd66b";
 ctx.fillRect(0,0,600,400);

 // Path
 ctx.fillStyle="#d8bd83";
 ctx.fillRect(0,175,600,55);
 ctx.fillRect(270,0,55,400);

 // Houses
 house(35,35,"🏠");
 house(475,35,"🏡");
 house(35,310,"🏠");
 house(475,310,"🏡");

 // Trees
 ["🌳","🌲","🌳","🌲"].forEach((t,i)=>{
  ctx.font="38px Arial";
  ctx.fillText(t,[180,400,180,400][i],[60,60,350,350][i]);
 });

 // Cow
 ctx.font="38px Arial";
 ctx.fillText("🐄",350,150);

 // Treasures
 treasures.forEach(t=>{
  ctx.font="27px Arial";
  ctx.fillText(t.type==="coin"?"🪙":"🌸",t.x,t.y);
 });

 // Player
 ctx.font="38px Arial";
 ctx.fillText("🧑",player.x-18,player.y+12);
}

function house(x,y,emoji){
 ctx.font="55px Arial";
 ctx.fillText(emoji,x,y+45);
}

function move(dx,dy){
 player.x=Math.max(20,Math.min(580,player.x+dx*25));
 player.y=Math.max(25,Math.min(375,player.y+dy*25));
 collect();
 draw();
}

function collect(){
 treasures=treasures.filter(t=>{
  if(Math.hypot(t.x-player.x,t.y-player.y)<35){
   if(t.type==="coin"){
    coins++;
    document.getElementById("message").textContent="Amazing! You found a coin!";
   }else{
    flowers++;
    document.getElementById("message").textContent="Beautiful flower collected!";
   }
   return false;
  }
  return true;
 });

 level=Math.floor(coins/5)+1;
 document.getElementById("coins").textContent=coins;
 document.getElementById("flowers").textContent=flowers;
 document.getElementById("level").textContent=level;

 if(treasures.length===0){
  document.getElementById("message").textContent="🎉 Village explorer! You collected everything!";
 }
}

function restart(){
 player={x:300,y:200};
 coins=0;flowers=0;level=1;
 treasures=[
  {x:100,y:100,type:"coin"},
  {x:500,y:100,type:"flower"},
  {x:200,y:300,type:"coin"},
  {x:450,y:300,type:"flower"},
  {x:300,y:80,type:"coin"},
  {x:100,y:300,type:"flower"}
 ];
 document.getElementById("coins").textContent=0;
 document.getElementById("flowers").textContent=0;
 document.getElementById("level").textContent=1;
 document.getElementById("message").textContent="Explore the village and collect treasures!";
 draw();
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp")move(0,-1);
 if(e.key==="ArrowDown")move(0,1);
 if(e.key==="ArrowLeft")move(-1,0);
 if(e.key==="ArrowRight")move(1,0);
});

draw();
</script>
</body>
</html>
