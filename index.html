<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dream Village Adventure V17</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd8f4;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.pill{background:#fffffff0;padding:10px 15px;border-radius:20px;color:#31523b;font-weight:bold;box-shadow:0 3px 12px #31523b30}
#message{position:fixed;top:65px;left:50%;transform:translateX(-50%);background:#fffffff0;color:#31523b;padding:9px 14px;border-radius:16px;font-weight:bold;z-index:5;white-space:nowrap;font-size:13px}
#controls{position:fixed;bottom:22px;left:18px;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:5px;z-index:8}
.ctrl{border:2px solid #ffffffcc;border-radius:17px;background:#fffE;color:#65402f;font-size:25px;font-weight:bold;box-shadow:0 3px 8px #0003;touch-action:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#actions{position:fixed;bottom:34px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:8}
.action{border:0;border-radius:22px;padding:15px 18px;background:#ffcf55;color:#65402f;font-weight:bold;font-size:16px;box-shadow:0 3px 9px #0003}
#help{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);font-size:11px;color:white;text-shadow:0 1px 4px #333;z-index:4;white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#9bd8f4;color:#31523b;font-weight:bold;font-size:20px;z-index:20}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="game"></div>
<div id="loading">Preparing your village...</div>
<div id="hud">
 <div class="pill">🌸 DREAM VILLAGE V17</div>
 <div class="pill">🪙 <span id="coins">0</span></div>
</div>
<div id="message">Welcome! Explore your beautiful village.</div>
<div id="controls">
 <button class="ctrl" id="up">▲</button>
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="down">▼</button>
 <button class="ctrl" id="right">▶</button>
</div>
<div id="actions">
 <button class="action" id="shop">🛍️ SHOP</button>
 <button class="action" id="gift">🎁 GIFT</button>
</div>
<div id="help">Use arrows to explore and collect coins</div>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd8f4);
scene.fog=new THREE.Fog(0x9bd8f4,55,125);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,200);
camera.position.set(0,12,19);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x71834b,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-18,30,16);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const material=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=material(0x79c66b),path=material(0xe4c18a),wood=material(0x87502e);
const fenceMat=material(0xf3dfb5),leaf=material(0x358d49);
const darkLeaf=material(0x27763e),trunk=material(0x79502f);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),grass);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

function box(parent,x,y,z,w,h,d,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function sphere(parent,x,y,z,r,mat,sx=1,sy=1,sz=1){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);
 m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function cylinder(parent,x,y,z,rt,rb,h,mat,segments=16){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),mat);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}

// Main village roads
const mainRoad=new THREE.Mesh(new THREE.PlaneGeometry(6,115),path);
mainRoad.rotation.x=-Math.PI/2;mainRoad.position.y=.025;scene.add(mainRoad);
const crossRoad=new THREE.Mesh(new THREE.PlaneGeometry(90,5),path);
crossRoad.rotation.x=-Math.PI/2;crossRoad.position.set(0,.03,-17);scene.add(crossRoad);
const sideRoad=new THREE.Mesh(new THREE.PlaneGeometry(5,70),path);
sideRoad.rotation.x=-Math.PI/2;sideRoad.position.set(19,.035,0);scene.add(sideRoad);

// Fence around the village
for(let z=-36;z<=36;z+=3){
 for(const x of [-31,31])cylinder(scene,x,.65,z,.11,.11,1.3,wood,8);
}
for(let x=-31;x<=31;x+=3){
 for(const z of [-36,36])cylinder(scene,x,.65,z,.11,.11,1.3,wood,8);
}
for(const z of [-36,36])box(scene,0,.9,z,62,.12,.12,fenceMat);
for(const x of [-31,31])box(scene,x,.9,0,.12,.12,72,fenceMat);

// Houses with doors, windows and roofs
function makeHouse(x,z,wallColor,roofColor){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const wall=material(wallColor),roof=material(roofColor),glass=material(0x9bd9e8);
 box(g,0,1.35,0,4.5,2.7,3.8,wall);
 const roofMesh=new THREE.Mesh(new THREE.ConeGeometry(3.6,2,4),roof);
 roofMesh.position.set(0,3.65,0);
 roofMesh.rotation.y=Math.PI/4;
 roofMesh.scale.set(1,1,.85);
 roofMesh.castShadow=true;g.add(roofMesh);
 box(g,0,.95,1.93,.9,1.9,.12,material(0x68402b));
 box(g,-1.35,1.65,1.94,.8,.8,.13,glass);
 box(g,1.35,1.65,1.94,.8,.8,.13,glass);
 box(g,-1.35,1.65,2.03,.08,.9,.05,white);
 box(g,1.35,1.65,2.03,.08,.9,.05,white);
 box(g,0,.08,2.25,1.6,.16,.8,material(0xe9d4aa));
 return g;
}
makeHouse(-12,-15,0xffdfb0,0xb45b47);
makeHouse(12,-18,0xf0c5a7,0x9d62b6);
makeHouse(-15,13,0xe8d69d,0x4c8fbd);
makeHouse(14,14,0xffd1a4,0xc46b48);

// Trees
function makeTree(x,z,s=1){
 const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
 cylinder(g,0,1,0,.32,.43,2,trunk);
 sphere(g,0,2.55,0,1.4,leaf,1,1.15,1);
 sphere(g,-.72,2.25,.05,.9,darkLeaf);
 sphere(g,.72,2.25,.05,.9,leaf);
}
for(let i=0;i<46;i++){
 const x=(Math.random()-.5)*56,z=(Math.random()-.5)*65;
 if(Math.abs(x)>5 && Math.abs(z)>5 && !(Math.abs(x)<10&&Math.abs(z+17)<7))makeTree(x,z,.75+Math.random()*.35);
}

// Flowers and small bushes
for(let i=0;i<95;i++){
 const x=(Math.random()-.5)*50,z=(Math.random()-.5)*60;
 if(Math.abs(x)>4){
  cylinder(scene,x,.12,z,.035,.04,.24,leaf,7);
  sphere(scene,x,.27,z,.13,material([0xffdf58,0xff8fbd,0xffffff,0xb99aff][i%4]));
 }
}

// Player character
const player=new THREE.Group();
scene.add(player);
const body=new THREE.Group();player.add(body);

const skin=material(0xf2bd96);
const hair=material(0x4b2920);
const dress=material(0xe94f91);
const dressLight=material(0xffacd0);
const shoe=material(0x693b32);
const eye=material(0x241916);
const bag=material(0x8c552d);
const whiteMat=material(0xffffff);

// Legs
const legL=new THREE.Group(),legR=new THREE.Group();
legL.position.set(-.19,.62,0);
legR.position.set(.19,.62,0);
body.add(legL,legR);
function makeLeg(g){
 cylinder(g,0,-.22,0,.13,.15,.48,skin);
 sphere(g,0,-.47,.13,.18,shoe,1,.65,1.3);
}
makeLeg(legL);makeLeg(legR);

// Dress with a natural flared shape
const skirt=new THREE.Mesh(new THREE.CylinderGeometry(.3,.66,.85,24),dress);
skirt.position.y=1.02;skirt.castShadow=true;body.add(skirt);
cylinder(body,0,1.49,0,.27,.3,.2,dressLight);

// Neck and head
cylinder(body,0,1.62,0,.13,.13,.3,skin);
sphere(body,0,2.08,0,.49,skin,.85,1.05,.78);

// Hair cap and long hair behind head
sphere(body,0,2.36,-.08,.51,hair,.98,.62,.88);
sphere(body,-.42,2.04,-.12,.2,hair,.8,1.5,1);
sphere(body,.42,2.04,-.12,.2,hair,.8,1.5,1);
sphere(body,0,1.88,-.38,.39,hair,.9,1.1,.45);

// Face details on the front
sphere(body,-.17,2.1,.39,.045,eye);
sphere(body,.17,2.1,.39,.045,eye);
sphere(body,-.18,2.18,.42,.018,whiteMat);
sphere(body,.16,2.18,.42,.018,whiteMat);
sphere(body,0,1.96,.43,.065,material(0xd77b7c),1,.55,.6);
sphere(body,-.29,1.99,.38,.09,material(0xf39aa5),1,.6,.4);
sphere(body,.29,1.99,.38,.09,material(0xf39aa5),1,.6,.4);

// Hair bow
sphere(body,.32,2.56,.12,.15,material(0xff77ad),1.2,.65,.7);
sphere(body,.49,2.56,.12,.15,material(0xff77ad),1.2,.65,.7);
sphere(body,.4,2.56,.17,.07,material(0xffd64f));

// Arms
const armL=new THREE.Group(),armR=new THREE.Group();
armL.position.set(-.34,1.43,0);
armR.position.set(.34,1.43,0);
body.add(armL,armR);
function makeArm(g){
 cylinder(g,0,-.25,0,.105,.13,.48,skin);
 sphere(g,0,-.51,.02,.12,skin);
}
makeArm(armL);makeArm(armR);

// Backpack
box(body,-.39,1.25,-.34,.32,.48,.24,bag);
sphere(body,-.39,1.49,-.34,.16,bag);

// Start in a clear open area
player.position.set(0,0,1);

// Animals with walking legs
const animals=[];
function makeAnimal(x,z,color,type){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const fur=material(color);
 const legs=[];
 sphere(g,0,.62,0,.52,fur,1.25,.82,.85);
 sphere(g,.48,.88,.08,.32,fur,.95,.9,.9);
 sphere(g,.61,.92,.35,.045,eye);
 sphere(g,.73,.78,.31,.09,material(0xd47c78));
 if(type==='cow'){
  sphere(g,-.1,.93,.42,.17,whiteMat);
  sphere(g,.55,1.16,-.02,.1,fur);
 }else if(type==='sheep'){
  for(let i=0;i<7;i++)sphere(g,(i%4-.0)*.22-.3,.88+Math.floor(i/4)*.18,-.1,.23,whiteMat);
 }else{
  sphere(g,.4,1.16,0,.1,fur);
 }
 for(const lx of [-.3,.3])for(const lz of [-.23,.23]){
  legs.push(cylinder(g,lx,.25,lz,.065,.085,.43,material(0x614638),9));
 }
 animals.push({g,legs,x,z,phase:Math.random()*6});
}
makeAnimal(-8,-5,0xc9a276,'sheep');
makeAnimal(9,4,0x9b7048,'cow');
makeAnimal(-5,20,0xe3a342,'chicken');
makeAnimal(18,-5,0xd0a06d,'sheep');
makeAnimal(-18,3,0xffffff,'cow');

// Spinning collectible coins
const coins=[];
const gold=material(0xffc928,.35);
for(let i=0;i<28;i++){
 const g=new THREE.Group();
 const coin=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.09,24),gold);
 coin.rotation.x=Math.PI/2;coin.castShadow=true;g.add(coin);
 sphere(g,0,0,.06,.08,material(0xfff2a4));
 g.position.set((Math.random()-.5)*24,.9,(Math.random()-.5)*48);
 scene.add(g);coins.push(g);
}
let total=0;
const coinText=document.getElementById('coins');
function say(message){document.getElementById('message').textContent=message;}

// Touch controls
const keys={forward:false,back:false,left:false,right:false};
function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[key]=true;
  el.setPointerCapture(e.pointerId);
 });
 const stop=()=>keys[key]=false;
 el.addEventListener('pointerup',stop);
 el.addEventListener('pointercancel',stop);
 el.addEventListener('lostpointercapture',stop);
}
bindButton('up','forward');
bindButton('down','back');
bindButton('left','left');
bindButton('right','right');

addEventListener('keydown',e=>{
 if(['ArrowUp','w','W'].includes(e.key))keys.forward=true;
 if(['ArrowDown','s','S'].includes(e.key))keys.back=true;
 if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;
 if(['ArrowRight','d','D'].includes(e.key))keys.right=true;
});
addEventListener('keyup',e=>{
 if(['ArrowUp','w','W'].includes(e.key))keys.forward=false;
 if(['ArrowDown','s','S'].includes(e.key))keys.back=false;
 if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;
 if(['ArrowRight','d','D'].includes(e.key))keys.right=false;
});

document.getElementById('shop').onclick=()=>say('🛍️ Welcome to the village shop!');
document.getElementById('gift').onclick=()=>{
 total+=10;coinText.textContent=total;
 say('🎁 You received 10 bonus coins!');
};

// Smooth follow camera and walking animation
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const t=clock.elapsedTime;
 let dx=(keys.right?1:0)-(keys.left?1:0);
 let dz=(keys.back?1:0)-(keys.forward?1:0);
 const moving=dx!==0||dz!==0;

 if(moving){
  const len=Math.hypot(dx,dz);dx/=len;dz/=len;
  player.position.x+=dx*6*dt;
  player.position.z+=dz*6*dt;
  player.rotation.y=Math.atan2(dx,dz);
 }

 player.position.x=THREE.MathUtils.clamp(player.position.x,-27,27);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-32,32);

 body.position.y=moving?Math.abs(Math.sin(t*11))*.07:0;
 legL.rotation.x=moving?Math.sin(t*11)*.7:0;
 legR.rotation.x=moving?-Math.sin(t*11)*.7:0;
 armL.rotation.x=moving?-Math.sin(t*11)*.5:0;
 armR.rotation.x=moving?Math.sin(t*11)*.5:0;

 for(const a of animals){
  a.g.position.x=a.x+Math.sin(t*.55+a.phase)*1.5;
  a.g.position.z=a.z+Math.cos(t*.45+a.phase)*.9;
  a.g.rotation.y=Math.sin(t*.55+a.phase)*.5;
  a.legs.forEach((leg,i)=>leg.rotation.x=Math.sin(t*5+a.phase+i)*.3);
 }

 for(const c of coins){
  c.rotation.y+=dt*1.8;
  c.position.y=.9+Math.sin(t*2+c.position.x)*.12;
  if(c.visible&&c.position.distanceTo(player.position)<1.35){
   c.visible=false;
   total++;coinText.textContent=total;
   say('✨ Wonderful! You collected a coin!');
  }
 }

 // Wider camera view, following from behind and above
 const targetX=player.position.x;
 const targetZ=player.position.z+17;
 camera.position.x+=(targetX-camera.position.x)*dt*2.5;
 camera.position.z+=(targetZ-camera.position.z)*dt*2.5;
 camera.position.y+=(12-camera.position.y)*dt*2;
 camera.lookAt(player.position.x,1.25,player.position.z);

 renderer.render(scene,camera);
}

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('loading').style.display='none';
animate();
</script>
</body>
</html>
